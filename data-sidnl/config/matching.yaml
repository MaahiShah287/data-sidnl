thresholds: {auto_match: 0.90, review: 0.75}

# 5-attribute comparison weights as specified in SIDNL System Design Report (Page 4):
# Product Name: 35%, Brand: 25%, Quantity / Pack Size: 20%, Variant: 15%, Category: 5%
weights:
  name: 0.35
  brand: 0.25
  size: 0.20
  variant: 0.15
  category: 0.05

chunk_rows: 50000

# ---------------- DYNAMIC BRAND & VOCABULARY ARCHITECTURE ----------------
# NOTE: Brands are NEVER required to be hardcoded here.
# Brands are automatically and dynamically discovered from platform feeds, cleaned of
# corporate suffixes (Pvt Ltd, LLC, etc.), extracted from title prefixes, and registered
# into the database (ref_brand_alias table).
#
# Optional manual aliases below are only for colloquial slang/abbreviations (e.g., coke -> coca-cola).
# All other standard brands (e.g., Dove, Samsung, Apple, Amul, Lays, Nike, etc.) are handled 100% dynamically.
brand_aliases:
  coca-cola: [coca cola, coca-cola, coke, cocacola]

# Physical measurement units (physical constants for standardizing sizes: 1 L = 1000 ml, 1 kg = 1000 g)
units:
  ml: [ml, 1]
  l: [ml, 1000]
  ltr: [ml, 1000]
  ltrs: [ml, 1000]
  litre: [ml, 1000]
  litres: [ml, 1000]
  liter: [ml, 1000]
  liters: [ml, 1000]
  g: [g, 1]
  gm: [g, 1]
  gms: [g, 1]
  gram: [g, 1]
  grams: [g, 1]
  kg: [g, 1000]
  kgs: [g, 1000]
  mg: [g, 0.001]
  pc: [pcs, 1]
  pcs: [pcs, 1]
  piece: [pcs, 1]
  pieces: [pcs, 1]
  pack: [pcs, 1]
  units: [pcs, 1]
  unit: [pcs, 1]
  m: [m, 1]
  meter: [m, 1]
  cm: [m, 0.01]
  mm: [m, 0.001]
  gb: [gb, 1]
  tb: [gb, 1024]
  mb: [gb, 0.0009765625]

# Generic variant synonyms (colours, editions, formulations across categories)
variants:
  diet: [diet, light, lite]
  zero: [zero, sugar free, sugarfree, no sugar, zero sugar]
  classic: [classic, original, regular]
  lime: [lime, nimbu, lemon]
  orange: [orange]
  mango: [mango]
  cherry: [cherry]
  vanilla: [vanilla]
  black: [black]
  white: [white]
  silver: [silver]
  blue: [blue]
  red: [red]
  gold: [gold]
  small: [small, s]
  medium: [medium, m]
  large: [large, l]
  xl: [xl, extra large]
  xxl: [xxl]

# Generic noise words (uninformative tokens across e-commerce categories)
noise_words:
  - can
  - bottle
  - pet
  - tin
  - pack
  - of
  - pcs
  - pc
  - ml
  - ltr
  - soft
  - drink
  - cold
  - beverage
  - carbonated
  - flavoured
  - flavored
  - new
  - with
  - and
  - online
  - buy
  - best
  - quality
  - original
  - combo
  - set

learn:                         # dynamic learning settings
  auto_learn_on_ingest: true   # automatically learn & register brands during ingestion
  min_brand_count: 2           # a brand string must appear on at least this many products
  ignore_brands: ["na", "n a", "none", "null", "generic", "others", "other", "unbranded", "no brand", "unknown", "not applicable"]
  noise_group_min_rows: 200    # a category needs this many sampled products before we look for noise words
  noise_min_df: 0.30           # token in >=30% of a category's names -> suggested as noise (needs approval)
  noise_sample_rows: 300000
